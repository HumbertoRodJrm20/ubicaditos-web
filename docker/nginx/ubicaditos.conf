# Ubicaditos — Nginx delantero de PHP-FPM y proxy de Laravel Reverb.
# En IONOS se recomienda terminar TLS en un balanceador o en un proxy inverso
# superior; este servidor escucha HTTP en el puerto 80 del contenedor.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 20M;

    # Archivos estáticos (incluye public/build generado por Vite).
    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 120;
    }

    # Laravel Reverb usa el protocolo Pusher en /app/{app-key}.
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
