# Despliegue de producción en VPS/IONOS.
# Copiar .env.production.example a .env, generar APP_KEY y revisar los secretos
# antes de levantar los servicios:
#   docker compose -f compose.production.yaml up -d --build
#   docker compose -f compose.production.yaml exec app php artisan migrate --force

name: ubicaditos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-ubicaditos}"
      POSTGRES_USER: "${DB_USERNAME:-ubicaditos}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatorio en producción}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${DB_USERNAME:-ubicaditos}\" -d \"${DB_DATABASE:-ubicaditos}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - storage:/var/www/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5

  reverb:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    expose:
      - "8080"

  queue:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--tries=3"]

volumes:
  pgdata:
  storage:
